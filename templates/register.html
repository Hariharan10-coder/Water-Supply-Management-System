<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - WSMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card" style="max-width: 520px;">
        <div class="auth-logo">💧</div>
        <h1>Create Account</h1>
        <p>Register as Customer</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Address</label><input type="text" name="address" required></div>
            <div class="form-group"><label>Phone Number</label><input type="text" name="phone" required></div>
            <div class="form-group">
                <label>Zone (Optional)</label>
                <select name="zone">
                    <option value="">Select zone</option>
                    <option>Zone 1 - North</option>
                    <option>Zone 2 - South</option>
                    <option>Zone 3 - East</option>
                    <option>Zone 4 - West</option>
                    <option>Zone 5 - Central</option>
                </select>
            </div>
            <div class="form-group"><label>Username</label><input type="text" name="username" required minlength="4"></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="8"></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" required minlength="8"></div>
            <button type="submit" class="btn-primary btn-block">Register</button>
        </form>
        <div class="auth-footer"><a href="/login">Already have an account? Login</a></div>
    </div>
</body>
</html>
