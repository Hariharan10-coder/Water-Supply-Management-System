<!DOCTYPE html>
<html>

<head>

<title>
Water Supply Management System
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background">


<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>


<div class="login-card">


<div class="logo"></div>


<h1>
Water Supply
</h1>

<h3>
Management System
</h3>



<form id="loginForm">


<div class="input-box">

<input 
type="text"
id="username"
required>

<label>
Username
</label>

</div>




<div class="input-box">

<input
type="password"
id="password"
required>

<label>
Password
</label>

</div>




<button>
LOGIN
</button>



<p id="message"></p>


</form>


</div>


</div>





<script>


document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){


e.preventDefault();



let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;



let response =
await fetch(
"/login",
{

method:"POST",

headers:
{
"Content-Type":
"application/x-www-form-urlencoded"
},


body:
"username="+username+
"&password="+password

});



let data =
await response.json();



if(data.status=="success")
{


document
.getElementById("message")
.style.color="green";


document
.getElementById("message")
.innerHTML=
"Login Successful";


setTimeout(()=>{

window.location.href=
"dashboard.html";


},1000);



}

else{


document
.getElementById("message")
.style.color="red";


document
.getElementById("message")
.innerHTML=
"Invalid Username or Password";


}



});


</script>


</body>

</html>
