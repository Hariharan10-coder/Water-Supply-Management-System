<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Password Reset - WSMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1>Reset Customer Password</h1>
    <p>Verify your account using your username and registered phone number.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>Registered Phone Number</label>
            <input type="text" name="phone" required autocomplete="tel">
        </div>
        <button type="submit" class="btn-primary btn-block">Verify Account</button>
    </form>

    <div class="auth-footer">
        <a href="/login">Back to Login</a>
    </div>
</div>
</body>
</html>
