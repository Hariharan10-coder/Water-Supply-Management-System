{% extends "base.html" %}
{% block title %}Report Leakage{% endblock %}
{% block content %}
<div class="page-header"><h1>Report Leakage</h1></div>
<div class="card" style="max-width: 500px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if customers is not none %}
        <div class="form-group">
            <label>Customer (Optional)</label>
            <select name="customer_id">
                <option value="">General / Public</option>
                {% for c in customers %}<option value="{{ c.customer_id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        {% endif %}
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" required placeholder="Street, area...">
        </div>
        <div class="form-group">
            <label>Severity</label>
            <select name="severity">
                <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Submit</button>
        <a href="/leakage" class="btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
