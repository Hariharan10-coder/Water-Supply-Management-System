{% extends "base.html" %}
{% block title %}Edit Staff Account{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="fas fa-user-edit"></i> Edit Staff Account</h1></div>
<div class="card" style="max-width: 700px;">
    <div class="alert alert-info">Role: <strong>{{ 'Water Supply Officer' if user.role == 'officer' else 'Maintenance Staff' }}</strong>. Role changes are restricted to keep permissions predictable.</div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label>Full Name *</label><input type="text" name="full_name" value="{{ form.get('full_name', user.full_name or '') if form else (user.full_name or '') }}" required></div>
        <div class="form-group"><label>Username *</label><input type="text" name="username" value="{{ form.get('username', user.username) if form else user.username }}" required minlength="4"></div>
        <div class="form-group"><label>Phone Number *</label><input type="text" name="phone" value="{{ form.get('phone', user.phone or '') if form else (user.phone or '') }}" required></div>
        <div class="form-group"><label>Email (Optional)</label><input type="email" name="email" value="{{ form.get('email', user.email or '') if form else (user.email or '') }}"></div>
        <button type="submit" class="btn-primary">Save Changes</button>
        <a href="/users" class="btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
