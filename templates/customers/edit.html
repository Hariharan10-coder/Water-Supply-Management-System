{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="fas fa-user-edit"></i> Edit Customer Account</h1></div>
<div class="card" style="max-width:700px;">
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Full Name *</label><input name="name" required value="{{ form.get('name', customer.name) if form else customer.name }}"></div>
<div class="form-group"><label>Address *</label><input name="address" required value="{{ form.get('address', customer.address) if form else customer.address }}"></div>
<div class="form-group"><label>Phone Number *</label><input name="phone" required value="{{ form.get('phone', customer.phone) if form else customer.phone }}"></div>
<div class="form-group"><label>Email (Optional)</label><input type="email" name="email" value="{{ form.get('email', customer.email or '') if form else (customer.email or '') }}"></div>
<div class="form-group"><label>Username *</label><input name="username" required minlength="4" value="{{ form.get('username', user.username if user else '') if form else (user.username if user else '') }}"></div>
<button class="btn-primary" type="submit">Save Changes</button>
<a href="/customers" class="btn-outline">Cancel</a>
</form>
</div>
{% endblock %}
